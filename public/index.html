<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080D">
  <meta name="description" content="VAULT RUSH — a two-player simultaneous-pick heist duel.">
  <title>VAULT RUSH — The Heist Duel</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080D;
      --panel: rgba(17, 20, 30, .82);
      --panel-strong: rgba(21, 25, 37, .96);
      --line: rgba(191, 219, 255, .13);
      --text: #F4F7FC;
      --muted: #9AA5B6;
      --cyan: #00E5FF;
      --magenta: #FF2E93;
      --gold: #FFC94A;
      --red: #FF475D;
      --green: #7CFFB2;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --radius-sm: 12px;
      --radius: 20px;
      --radius-lg: 28px;
      --shadow-cyan: 0 0 28px rgba(0, 229, 255, .18);
      --shadow-pink: 0 0 26px rgba(255, 46, 147, .18);
      --shadow-card: 0 20px 65px rgba(0, 0, 0, .38);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      font-weight: 500;
      background: var(--bg);
      color: var(--text);
    }

    * { box-sizing: border-box; }

    html, body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      font-variant-numeric: tabular-nums;
    }

    button, input { font: inherit; }

    button {
      color: inherit;
      cursor: pointer;
      border: 0;
    }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .city {
      position: fixed;
      inset: auto 0 0;
      height: min(38vh, 330px);
      z-index: 0;
      opacity: .38;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, transparent, #000 32%);
    }

    .city svg { width: 100%; height: 100%; display: block; }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 38%, transparent 18%, rgba(0,0,0,.7) 100%);
    }

    .grain {
      position: fixed;
      inset: -50%;
      z-index: 20;
      pointer-events: none;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
      transform: rotate(-7deg);
    }

    #app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      padding: calc(18px + var(--safe-top)) 18px calc(22px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
    }

    #fx {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .connection-banner {
      position: fixed;
      z-index: 40;
      top: calc(10px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border: 1px solid rgba(255, 201, 74, .36);
      border-radius: 999px;
      background: rgba(35, 27, 12, .94);
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      box-shadow: var(--shadow-card);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      white-space: nowrap;
    }

    .connection-banner.show { opacity: 1; }

    .topbar {
      width: min(100%, 1080px);
      margin: 0 auto;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0, 229, 255, .55);
      border-radius: 7px;
      color: var(--cyan);
      box-shadow: var(--shadow-cyan);
      transform: rotate(45deg);
    }

    .brand-mark span { transform: rotate(-45deg); }

    .top-actions { display: flex; gap: 8px; }

    .icon-button, .quiet-button {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: transform .18s ease, opacity .18s ease;
    }

    .icon-button:hover, .quiet-button:hover { transform: translateY(-2px); }
    .icon-button:active, .quiet-button:active { transform: scale(.97); }

    .connection-state {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--red);
      box-shadow: 0 0 10px currentColor;
    }

    .dot.online { background: var(--green); color: var(--green); }
    .dot.offline { background: var(--red); color: var(--red); }

    .screen {
      width: min(100%, 1080px);
      margin: auto;
      padding: clamp(22px, 5vh, 54px) 0;
      animation: screen-in .34s ease both;
    }

    @keyframes screen-in {
      from { opacity: 0; transform: translateY(10px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .title {
      margin: 10px 0 0;
      font-size: clamp(38px, 9vw, 82px);
      line-height: .9;
      font-weight: 1000;
      letter-spacing: -.07em;
      text-transform: uppercase;
    }

    .title .accent {
      color: transparent;
      -webkit-text-stroke: 1px var(--cyan);
      text-shadow: 0 0 22px rgba(0,229,255,.28);
    }

    .subtitle {
      max-width: 560px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: clamp(14px, 2.2vw, 17px);
      line-height: 1.65;
    }

    .landing {
      min-height: min(720px, calc(100dvh - 92px));
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 14px;
      animation: logo-arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .logo-kicker {
      margin: 0 0 10px;
      color: var(--magenta);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .42em;
      text-transform: uppercase;
    }

    @keyframes logo-arrive {
      from { opacity: 0; transform: translateY(18px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .landing-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    .button {
      position: relative;
      min-height: 54px;
      padding: 0 22px;
      overflow: hidden;
      border: 1px solid rgba(0,229,255,.45);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(0,229,255,.16), rgba(0,229,255,.04));
      color: var(--text);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .13em;
      text-transform: uppercase;
      box-shadow: var(--shadow-cyan);
      transition: transform .18s ease, opacity .18s ease;
    }

    .button:hover { transform: translateY(-3px); }
    .button:active { transform: scale(.97); }
    .button.primary { background: var(--cyan); color: #041014; }
    .button.secondary {
      border-color: rgba(255,46,147,.5);
      background: rgba(255,46,147,.08);
      box-shadow: var(--shadow-pink);
    }

    .button.gold {
      border-color: rgba(255,201,74,.55);
      background: linear-gradient(135deg, rgba(255,201,74,.22), rgba(255,201,74,.05));
      box-shadow: 0 0 28px rgba(255,201,74,.12);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: .42;
      transform: none;
    }

    .join-panel {
      width: min(100%, 400px);
      margin-top: 22px;
      padding: 20px;
      display: grid;
      gap: 12px;
      text-align: left;
    }

    .glass {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(18px);
    }

    .field-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .text-input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(4,6,10,.72);
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .04em;
    }

    .code-input {
      text-transform: uppercase;
      font-size: 20px;
      letter-spacing: .32em;
      text-align: center;
    }

    .card {
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--panel);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(20px);
    }

    .center { text-align: center; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; line-height: 1.6; }
    .section-head { margin: 0 0 8px; font-size: clamp(22px, 4vw, 34px); letter-spacing: -.04em; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .wrap { flex-wrap: wrap; }

    .room-code {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      color: var(--cyan);
      font-size: clamp(38px, 10vw, 64px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: .18em;
      text-shadow: 0 0 28px rgba(0,229,255,.32);
    }

    .room-code .quiet-button { font-size: 10px; letter-spacing: .1em; }

    .radar {
      width: 92px;
      height: 92px;
      margin: 22px auto;
      position: relative;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0,229,255,.45);
      border-radius: 50%;
      color: var(--cyan);
      box-shadow: inset 0 0 24px rgba(0,229,255,.1), var(--shadow-cyan);
    }

    .radar::before, .radar::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(0,229,255,.25);
      border-radius: 50%;
      animation: radar-pulse 2.4s ease-out infinite;
    }

    .radar::after { animation-delay: 1.2s; }

    @keyframes radar-pulse {
      0% { opacity: .7; transform: scale(.45); }
      100% { opacity: 0; transform: scale(1.32); }
    }

    .players-row {
      width: min(100%, 620px);
      margin: 22px auto 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .player-card {
      min-height: 86px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.035);
      text-align: left;
    }

    .player-avatar {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0,229,255,.38);
      border-radius: 13px;
      color: var(--cyan);
      font-size: 14px;
      font-weight: 950;
      background: rgba(0,229,255,.08);
    }

    .player-card .name {
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-card .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .ready-actions { margin-top: 26px; }
    .room-meta { color: var(--muted); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; }

    .game-shell {
      width: min(100%, 920px);
      margin: auto;
    }

    .game-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin: 10px 0 20px;
    }

    .round-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .role-badge {
      justify-self: center;
      padding: 9px 13px;
      border: 1px solid rgba(0,229,255,.42);
      border-radius: 999px;
      background: rgba(0,229,255,.08);
      color: var(--cyan);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .role-badge.guard {
      border-color: rgba(255,46,147,.42);
      background: rgba(255,46,147,.08);
      color: #FF7AB8;
    }

    .score-strip {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .score-pill {
      min-width: 70px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      text-align: center;
    }

    .score-pill strong {
      display: block;
      color: var(--gold);
      font-size: 18px;
      font-weight: 1000;
    }

    .score-pill span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .instruction {
      min-height: 25px;
      margin: 0 auto 14px;
      color: var(--text);
      text-align: center;
      font-size: clamp(13px, 2vw, 16px);
      font-weight: 850;
      letter-spacing: .02em;
    }

    .instruction span { color: var(--cyan); }
    .instruction .pink { color: #FF7AB8; }

    .pick-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      align-items: start;
      gap: 20px;
    }

    .vault-grid {
      width: min(100%, 570px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(88px, 1fr));
      gap: clamp(8px, 2vw, 14px);
    }

    .vault {
      position: relative;
      aspect-ratio: 1;
      min-width: 88px;
      min-height: 88px;
      padding: 10px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 4px;
      border: 1px solid rgba(188,205,234,.17);
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(36,43,60,.94), rgba(12,15,23,.96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 24px rgba(0,0,0,.25);
      transition: transform .17s ease, opacity .17s ease;
    }

    .vault:hover { transform: translateY(-3px); }
    .vault:active { transform: scale(.96); }
    .vault.selected {
      border: 2px solid var(--cyan);
      box-shadow: inset 0 0 22px rgba(0,229,255,.12), 0 0 24px rgba(0,229,255,.23);
      transform: translateY(-2px);
    }

    .vault-icon {
      width: 28px;
      height: 28px;
      color: rgba(217,230,248,.62);
    }

    .vault-value {
      color: var(--gold);
      font-size: clamp(20px, 5vw, 29px);
      font-weight: 1000;
      line-height: 1;
      text-shadow: 0 0 13px rgba(255,201,74,.34);
    }

    .vault-label {
      color: var(--muted);
      font-size: 8px;
      font-weight: 850;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .vault.reveal-thief {
      border-color: var(--cyan);
      box-shadow: 0 0 26px rgba(0,229,255,.3);
    }

    .vault.reveal-guard {
      border-color: var(--magenta);
      box-shadow: 0 0 26px rgba(255,46,147,.3);
    }

    .vault.reveal-hit {
      animation: vault-hit .38s cubic-bezier(.18,.8,.22,1) both;
    }

    .vault.reveal-open .vault-icon { color: var(--gold); }

    @keyframes vault-hit {
      0% { opacity: .5; transform: scale(.82); }
      70% { opacity: 1; transform: scale(1.06); }
      100% { opacity: 1; transform: scale(1); }
    }

    .pick-side {
      display: grid;
      gap: 12px;
    }

    .timer-card {
      padding: 16px;
      display: grid;
      justify-items: center;
      gap: 8px;
      text-align: center;
    }

    .timer-ring {
      width: 78px;
      height: 78px;
      overflow: visible;
      transform: rotate(-90deg);
    }

    .timer-ring circle { fill: none; stroke-width: 6; }
    .timer-track { stroke: rgba(255,255,255,.1); }
    .timer-progress {
      stroke: var(--cyan);
      stroke-linecap: round;
      stroke-dasharray: 188.5;
      stroke-dashoffset: 0;
    }

    .timer-value {
      position: absolute;
      margin-top: 27px;
      color: var(--text);
      font-size: 20px;
      font-weight: 1000;
    }

    .timer-wrap { position: relative; width: 78px; height: 78px; }
    .timer-caption { color: var(--muted); font-size: 9px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .timer-card.urgent .timer-progress { stroke: var(--red); }
    .timer-card.urgent .timer-value { color: #FF8B98; }

    .power-card { padding: 15px; }
    .power-card h3 { margin: 0 0 7px; font-size: 12px; font-weight: 950; letter-spacing: .1em; text-transform: uppercase; }
    .power-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; }

    .power-toggle {
      width: 100%;
      min-height: 42px;
      margin-top: 12px;
      border: 1px solid rgba(255,201,74,.4);
      border-radius: 11px;
      background: rgba(255,201,74,.08);
      color: var(--gold);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: transform .18s ease, opacity .18s ease;
    }

    .power-toggle:hover { transform: translateY(-2px); }
    .power-toggle.armed { background: rgba(255,201,74,.2); box-shadow: 0 0 20px rgba(255,201,74,.15); }
    .power-toggle:disabled { opacity: .4; cursor: not-allowed; }

    .pick-footer {
      width: min(100%, 570px);
      margin: 16px auto 0;
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    .pick-footer .button { width: 100%; }
    .pick-hint { min-height: 18px; color: var(--muted); font-size: 11px; text-align: center; }

    .waiting-lock {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .waiting-lock .dot { animation: dot-pulse 1.2s ease-in-out infinite; }

    @keyframes dot-pulse {
      0%, 100% { opacity: .45; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .laser {
      position: relative;
      overflow: hidden;
    }

    .laser::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -8%;
      height: 4px;
      z-index: 2;
      background: linear-gradient(90deg, transparent, var(--cyan), #fff, var(--cyan), transparent);
      box-shadow: 0 0 22px var(--cyan);
      animation: laser-sweep 1.2s ease-in-out both;
      pointer-events: none;
    }

    @keyframes laser-sweep {
      from { opacity: 0; transform: translateY(0); }
      20% { opacity: 1; }
      to { opacity: .25; transform: translateY(650px); }
    }

    .reveal-screen { text-align: center; }
    .reveal-title {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: clamp(30px, 7vw, 58px);
      font-weight: 1000;
      letter-spacing: -.05em;
      text-transform: uppercase;
      animation: screen-in .35s ease both;
    }

    .reveal-title.caught { color: var(--red); }
    .reveal-title.lockdown { color: var(--gold); }
    .reveal-copy { min-height: 24px; margin: 0 0 20px; color: var(--muted); font-size: 13px; }

    .reveal-grid {
      width: min(100%, 570px);
      margin: 0 auto;
      position: relative;
    }

    .reveal-grid .vault { pointer-events: none; }
    .pick-markers {
      position: absolute;
      inset: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }

    .pick-marker {
      padding: 5px 7px;
      border-radius: 7px;
      background: rgba(0,0,0,.78);
      color: var(--cyan);
      font-size: 8px;
      font-weight: 1000;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .pick-marker.guard { color: #FF7AB8; }

    .result-card {
      width: min(100%, 600px);
      margin: 18px auto 0;
      padding: 17px;
    }

    .result-deltas {
      display: flex;
      justify-content: center;
      gap: 16px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .result-deltas strong { color: var(--gold); }

    .caught-flash {
      animation: alarm-flash .34s ease-in-out 3;
    }

    @keyframes alarm-flash {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }

    .shake { animation: shake .28s ease-out 2; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .history-strip {
      margin: 22px auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .history-chip {
      min-width: 68px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      text-align: center;
    }

    .history-chip b { display: block; color: var(--gold); font-size: 15px; }
    .history-chip span { color: var(--muted); font-size: 8px; font-weight: 900; letter-spacing: .09em; text-transform: uppercase; }

    .scoreboard-grid {
      width: min(100%, 680px);
      margin: 22px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .scoreboard-person { padding: 20px; text-align: center; }
    .scoreboard-person strong {
      display: block;
      color: var(--gold);
      font-size: clamp(36px, 8vw, 58px);
      font-weight: 1000;
      line-height: 1;
    }

    .scoreboard-person span { display: block; margin-top: 8px; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }

    .final-mark {
      width: 78px;
      height: 78px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,201,74,.42);
      border-radius: 25px;
      color: var(--gold);
      background: rgba(255,201,74,.07);
      font-size: 32px;
      box-shadow: 0 0 34px rgba(255,201,74,.12);
      transform: rotate(-5deg);
    }

    .final-stats {
      width: min(100%, 540px);
      margin: 22px auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.035); }
    .stat strong { display: block; color: var(--cyan); font-size: 22px; font-weight: 1000; }
    .stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 8px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }

    .disconnect-shade {
      position: fixed;
      inset: 0;
      z-index: 25;
      padding: 18px;
      display: grid;
      place-items: center;
      background: rgba(5,6,10,.74);
      backdrop-filter: blur(10px);
    }

    .disconnect-card {
      width: min(100%, 420px);
      padding: 25px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: calc(18px + var(--safe-bottom));
      transform: translate(-50%, 12px);
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel-strong);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      box-shadow: var(--shadow-card);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      padding: 18px;
      display: grid;
      place-items: center;
      background: rgba(3,4,8,.78);
      backdrop-filter: blur(12px);
    }

    .modal {
      width: min(100%, 580px);
      padding: clamp(20px, 4vw, 32px);
      animation: screen-in .25s ease both;
    }

    .tutorial-progress {
      display: flex;
      gap: 6px;
      margin: 18px 0;
    }

    .tutorial-progress i {
      height: 4px;
      flex: 1;
      border-radius: 9px;
      background: rgba(255,255,255,.1);
    }

    .tutorial-progress i.active { background: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,.5); }

    .tutorial-art {
      height: 110px;
      margin: 14px 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: radial-gradient(circle, rgba(0,229,255,.1), transparent 65%);
      color: var(--cyan);
      font-size: 34px;
    }

    .modal-actions { margin-top: 20px; display: flex; justify-content: space-between; gap: 10px; }

    .toast-error { border-color: rgba(255,71,93,.45); color: #FF9AA6; }

    @media (max-width: 700px) {
      #app { padding-left: 14px; padding-right: 14px; }
      .pick-layout { grid-template-columns: 1fr; }
      .pick-side { width: min(100%, 570px); margin: 0 auto; grid-template-columns: 1fr 1fr; }
      .timer-card { grid-row: span 1; }
      .game-top { grid-template-columns: 1fr auto; }
      .score-strip { grid-column: 1 / -1; justify-content: center; }
      .role-badge { justify-self: end; }
      .round-label { align-self: center; }
      .screen { padding-top: 30px; padding-bottom: 28px; }
    }

    @media (max-width: 430px) {
      .landing-actions { width: 100%; }
      .landing-actions .button { flex: 1; padding: 0 13px; }
      .players-row { gap: 8px; }
      .player-card { min-height: 75px; padding: 11px; gap: 8px; }
      .player-avatar { width: 34px; height: 34px; border-radius: 10px; }
      .player-card .name { font-size: 11px; }
      .vault-grid { gap: 7px; }
      .vault { min-width: 88px; min-height: 88px; border-radius: 14px; padding: 7px; }
      .vault-icon { width: 24px; height: 24px; }
      .pick-side { grid-template-columns: 1fr; }
      .timer-card { display: flex; align-items: center; justify-content: center; gap: 12px; }
      .timer-wrap, .timer-ring { width: 58px; height: 58px; }
      .timer-value { margin-top: 19px; font-size: 17px; }
      .scoreboard-grid { gap: 8px; }
      .final-stats { gap: 6px; }
      .stat { padding: 11px 6px; }
      .room-code { gap: 6px; letter-spacing: .12em; }
      .room-code .quiet-button { padding: 0 8px; }
    }

    @media (max-height: 620px) and (orientation: landscape) {
      #app { padding-top: calc(8px + var(--safe-top)); padding-bottom: calc(8px + var(--safe-bottom)); }
      .screen { padding-top: 8px; padding-bottom: 8px; }
      .game-top { margin: 4px 0 8px; }
      .vault { min-height: 82px; }
      .vault-grid { max-width: 430px; }
      .pick-side { gap: 7px; }
      .timer-card, .power-card { padding: 9px; }
      .timer-wrap, .timer-ring { width: 58px; height: 58px; }
      .timer-value { margin-top: 19px; font-size: 17px; }
      .tutorial-art { height: 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="city" aria-hidden="true">
    <svg viewBox="0 0 1440 330" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#00E5FF" stop-opacity=".02"/>
          <stop offset="1" stop-color="#00E5FF" stop-opacity=".22"/>
        </linearGradient>
      </defs>
      <path fill="url(#sky)" d="M0 270h65v-62h35v62h38v-92h58v92h23v-46h46v46h33V132h68v138h34v-72h39v72h32V91h80v179h39v-54h41v54h30V149h60v121h37v-84h55v84h37V77h75v193h32v-43h50v43h38V126h74v144h45v-62h52v62h35v-104h61v104h42v-55h50v55h60v60H0z"/>
      <path fill="#080A10" d="M0 292h100v-30h50v30h70v-47h43v47h48v-20h46v20h55v-59h62v59h40v-24h53v24h60v-46h46v46h53v-28h60v28h45v-67h56v67h47v-36h50v36h55v-59h60v59h72v-34h65v34h65v38H0z"/>
      <g fill="#00E5FF" opacity=".32">
        <path d="M177 205h5v8h-5zm15 0h5v8h-5zm0 16h5v8h-5zm286-95h6v9h-6zm19 0h6v9h-6zm-19 19h6v9h-6zm350 25h6v9h-6zm18 0h6v9h-6zm19 0h6v9h-6zm255-46h6v9h-6zm18 0h6v9h-6z"/>
      </g>
    </svg>
  </div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="connection" class="connection-banner" role="status" aria-live="polite">Reconnecting…</div>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    const app = document.getElementById('app');
    const connectionBanner = document.getElementById('connection');
    const toastElement = document.getElementById('toast');
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');
    const STORAGE_KEY = 'vault-rush.session.v1';
    const NAME_KEY = 'vault-rush.name.v1';
    const TUTORIAL_KEY = 'vault-rush.tutorial.v1';
    const MUTE_KEY = 'vault-rush.muted.v1';
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let socket = null;
    let reconnectDelay = 1000;
    let reconnectTimer = null;
    let pulseTimer = null;
    let currentState = null;
    let currentViewKey = '';
    let selectedIndex = null;
    let powerArmed = false;
    let tutorialOpen = false;
    let tutorialStep = 0;
    let autoTutorialShown = false;
    let joinFormOpen = false;
    let connectionLost = false;
    let serverClockOffset = 0;
    let toastTimer = null;
    let countdownTimer = null;
    let lastTickSecond = null;
    let audioContext = null;
    let muted = localStorage.getItem(MUTE_KEY) === 'true';
    let particles = [];
    let particleFrame = null;
    let resizeTimer = null;
    let priorScores = null;

    function loadSession() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      } catch {
        return null;
      }
    }

    function saveSession(value) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    }

    function getName() {
      const field = document.getElementById('player-name');
      const entered = field ? field.value.trim() : '';
      const saved = localStorage.getItem(NAME_KEY) || '';
      const name = (entered || saved || 'PLAYER').replace(/[<>]/g, '').slice(0, 16);
      localStorage.setItem(NAME_KEY, name);
      return name;
    }

    function sendIntent(payload) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        showToast('Connecting to the game server…', true);
        return false;
      }
      socket.send(JSON.stringify(payload));
      return true;
    }

    function connect() {
      clearTimeout(reconnectTimer);
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(protocol + '//' + location.host);

      socket.addEventListener('open', () => {
        connectionLost = false;
        connectionBanner.classList.remove('show');
        reconnectDelay = 1000;
        clearInterval(pulseTimer);
        pulseTimer = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'pulse' }));
          }
        }, 20_000);

        const saved = loadSession();
        const queryRoom = new URLSearchParams(location.search).get('room');

        if (saved && saved.room && saved.token &&
            (!queryRoom || queryRoom.toUpperCase() === saved.room)) {
          socket.send(JSON.stringify({
            type: 'rejoin',
            room: saved.room,
            token: saved.token
          }));
        } else if (queryRoom) {
          socket.send(JSON.stringify({
            type: 'join',
            room: queryRoom.toUpperCase(),
            name: localStorage.getItem(NAME_KEY) || 'PLAYER'
          }));
        }
      });

      socket.addEventListener('message', event => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }

        if (message.type === 'welcome') {
          saveSession({
            room: message.room,
            token: message.token,
            playerId: message.playerId,
            name: message.name
          });
          history.replaceState(null, '', location.pathname + '?room=' + message.room);
          connectionLost = false;
          connectionBanner.classList.remove('show');
          render(true);
          return;
        }

        if (message.type === 'state') {
          if (currentState) {
            priorScores = {};
            for (const player of currentState.players) {
              priorScores[player.id] = player.score;
            }
          }
          currentState = message;
          serverClockOffset = message.serverNow - Date.now();

          if (message.status === 'ready' &&
              localStorage.getItem(TUTORIAL_KEY) !== 'done' &&
              !autoTutorialShown) {
            tutorialOpen = true;
            tutorialStep = 0;
            autoTutorialShown = true;
          }

          render();
          updateLive();
          return;
        }

        if (message.type === 'notice') {
          showToast(message.message);
          if (message.kind === 'locked') playSound('lock');
          return;
        }

        if (message.type === 'error') {
          if (message.code === 'REJOIN_EXPIRED') {
            localStorage.removeItem(STORAGE_KEY);
          }
          showToast(message.message, true);
        }
      });

      socket.addEventListener('close', () => {
        clearInterval(pulseTimer);
        connectionLost = true;
        connectionBanner.classList.add('show');
        reconnectTimer = setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 15_000);
      });

      socket.addEventListener('error', () => {
        connectionLost = true;
        connectionBanner.classList.add('show');
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function playerById(id) {
      return currentState && currentState.players.find(player => player.id === id);
    }

    function myPlayer() {
      return playerById(currentState && currentState.playerId);
    }

    function opponentPlayer() {
      return currentState &&
        currentState.players.find(player => player.id !== currentState.playerId);
    }

    function topbar() {
      const me = myPlayer();
      const opponent = opponentPlayer();

      return `
        <header class="topbar">
          <div class="brand-mini" aria-label="Vault Rush">
            <span class="brand-mark"><span>V</span></span>
            <span>Vault Rush</span>
          </div>
          <div class="top-actions">
            ${currentState ? `
              <span class="connection-state" aria-label="Connection status">
                <i class="dot ${connectionLost ? 'offline' : 'online'}"></i>
                ${connectionLost ? 'Offline' : 'Online'}
              </span>
            ` : ''}
            <button class="icon-button" data-action="mute" aria-label="${muted ? 'Unmute sound' : 'Mute sound'}">
              ${muted ? 'Sound off' : 'Sound on'}
            </button>
          </div>
        </header>
      `;
    }

    function landingScreen() {
      const savedName = escapeHtml(localStorage.getItem(NAME_KEY) || '');

      return `
        <main class="screen landing">
          <div class="logo-wrap">
            <p class="logo-kicker">Two players. One vault.</p>
            <h1 class="title">Vault<br><span class="accent">Rush</span></h1>
            <p class="subtitle">
              A neon-noir heist duel. Pick in secret, read your rival, and make every second count.
            </p>
          </div>

          <section class="join-panel glass" aria-label="Player callsign">
            <label class="field-label" for="player-name">Your callsign</label>
            <input class="text-input" id="player-name" maxlength="16" autocomplete="nickname"
              placeholder="PLAYER" value="${savedName}">
          </section>

          <div class="landing-actions">
            <button class="button primary" data-action="create">Create room</button>
            <button class="button secondary" data-action="join-toggle">Join room</button>
          </div>

          ${joinFormOpen ? `
            <section class="join-panel glass" aria-label="Join a room">
              <label class="field-label" for="room-code-input">Four-letter room code</label>
              <input class="text-input code-input" id="room-code-input" maxlength="4"
                autocomplete="off" autocapitalize="characters" placeholder="ABCD"
                aria-label="Four-letter room code">
              <button class="button primary" data-action="join">Join the heist</button>
            </section>
          ` : `
            <div class="landing-actions" style="margin-top:14px">
              <button class="quiet-button" data-action="tutorial-open">How to play</button>
            </div>
          `}
        </main>
      `;
    }

    function playerCard(player, readyLabel) {
      if (!player) {
        return `
          <div class="player-card">
            <div class="player-avatar">?</div>
            <div><div class="name">Waiting for rival</div><div class="meta">Invite a second player</div></div>
          </div>
        `;
      }

      const initials = escapeHtml(player.name.slice(0, 1).toUpperCase());
      return `
        <div class="player-card">
          <div class="player-avatar">${initials}</div>
          <div style="min-width:0;flex:1">
            <div class="name">${escapeHtml(player.name)}</div>
            <div class="meta">
              <i class="dot ${player.connected ? 'online' : 'offline'}" style="display:inline-block;vertical-align:middle;margin-right:5px"></i>
              ${player.connected ? readyLabel : 'Disconnected'}
            </div>
          </div>
        </div>
      `;
    }

    function roomHeader() {
      return `
        <div class="center">
          <div class="eyebrow">Private room</div>
          <div class="room-code">
            ${escapeHtml(currentState.room)}
            <button class="quiet-button" data-action="copy">Copy invite link</button>
          </div>
        </div>
      `;
    }

    function lobbyScreen() {
      const me = myPlayer();
      const rival = opponentPlayer();

      return `
        <main class="screen center">
          <section class="card">
            ${roomHeader()}
            <div class="radar" aria-hidden="true">⌁</div>
            <h1 class="section-head">Waiting for opponent…</h1>
            <p class="muted small">Share the room code or invite link. The match starts when both players connect.</p>
            <div class="players-row">
              ${playerCard(me, 'Connected')}
              ${playerCard(rival, 'Open seat')}
            </div>
            <div style="margin-top:24px">
              <button class="quiet-button" data-action="tutorial-open">How to play</button>
            </div>
          </section>
        </main>
      `;
    }

    function readyScreen() {
      const me = myPlayer();
      const rival = opponentPlayer();
      const bothReady = me && me.ready && rival && rival.ready;

      return `
        <main class="screen center">
          <section class="card">
            ${roomHeader()}
            <div class="eyebrow" style="margin-top:18px">Crew assembled</div>
            <h1 class="section-head">Set your sights.</h1>
            <p class="muted small">
              Six rounds. Roles alternate. Each player gets 15 seconds to lock one secret pick.
              Highest score wins.
            </p>
            <div class="players-row">
              ${playerCard(me, me && me.ready ? 'Ready' : 'Connected')}
              ${playerCard(rival, rival && rival.ready ? 'Ready' : 'Connected')}
            </div>
            <div class="ready-actions">
              <button class="button primary" data-action="ready" ${me && me.ready ? 'disabled' : ''}>
                ${me && me.ready ? 'You are ready' : 'Ready up'}
              </button>
              <p class="muted small">${bothReady ? 'Loading the vaults…' : 'Both players must ready up to begin.'}</p>
            </div>
          </section>
        </main>
      `;
    }

    function vaultIcon() {
      return `
        <svg class="vault-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="5" y="4" width="22" height="24" rx="5" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M16 11v10m-5-5h10M8 8h2m12 16h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      `;
    }

    function scorePill(player) {
      return `
        <div class="score-pill">
          <strong>${player ? player.score : 0}</strong>
          <span>${player ? escapeHtml(player.name) : '—'}</span>
        </div>
      `;
    }

    function vaultGrid(reveal = null) {
      const values = currentState.board || [];
      return `
        <div class="vault-grid ${reveal ? 'reveal-grid' : ''}" role="group" aria-label="Nine vaults">
          ${values.map((value, index) => {
            const selected = selectedIndex === index;
            let revealClass = '';
            if (reveal) {
              if (reveal.thiefIndex === index) revealClass += ' reveal-thief';
              if (reveal.guardIndex === index) revealClass += ' reveal-guard';
              if (reveal.thiefIndex === index || reveal.guardIndex === index) revealClass += ' reveal-hit';
              if (reveal.outcome === 'HEIST_SUCCESS' && reveal.thiefIndex === index) revealClass += ' reveal-open';
            }

            return `
              <button class="vault ${selected && !reveal ? 'selected' : ''} ${revealClass}"
                data-index="${index}" ${reveal ? 'tabindex="-1"' : ''}
                aria-label="Vault ${index + 1}, loot value ${value}${selected ? ', selected' : ''}"
                aria-pressed="${selected ? 'true' : 'false'}">
                ${vaultIcon()}
                <span class="vault-value">${value}</span>
                <span class="vault-label">Vault ${index + 1}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function gameScreen() {
      const me = myPlayer();
      const rival = opponentPlayer();
      const role = currentState.role;
      const locked = !!currentState.myPick;
      const usedPower = me && me.powerUsed;
      const powerName = role === 'thief' ? 'Ghost' : 'Lockdown';
      const powerSentence = role === 'thief'
        ? 'The Guard cannot protect the top-value vault this round.'
        : 'If the Thief targets a 4 or 5, they get half, rounded down, even on a match.';
      const isWaiting = locked;
      const roundLabel = currentState.suddenDeath
        ? 'Sudden death'
        : 'Round ' + currentState.round + ' / 6';

      if (locked) selectedIndex = currentState.myPick.index;

      return `
        <main class="screen game-shell">
          <div class="game-top">
            <div class="round-label">${roundLabel}</div>
            <div class="role-badge ${role === 'guard' ? 'guard' : ''}">
              You are ${role === 'thief' ? 'the Thief' : 'the Guard'}
            </div>
            <div class="score-strip">${scorePill(me)}${scorePill(rival)}</div>
          </div>

          <p class="instruction">
            You are the <span class="${role === 'guard' ? 'pink' : ''}">${role.toUpperCase()}</span>.
            ${role === 'thief' ? 'Pick a vault to crack.' : 'Pick a vault to protect.'}
          </p>

          <div class="pick-layout">
            <div>
              ${vaultGrid()}
              <div class="pick-footer">
                ${isWaiting ? `
                  <div class="waiting-lock"><i class="dot online"></i> Locked in. Waiting for opponent…</div>
                ` : `
                  <button class="button primary" data-action="confirm" ${selectedIndex === null ? 'disabled' : ''}>
                    Confirm secret pick
                  </button>
                  <div class="pick-hint">Choose a vault, then confirm. Picks stay hidden until both players lock in.</div>
                `}
              </div>
            </div>

            <aside class="pick-side">
              <div class="timer-card glass" id="timer-card">
                <div class="timer-wrap">
                  <svg class="timer-ring" viewBox="0 0 72 72" aria-hidden="true">
                    <circle class="timer-track" cx="36" cy="36" r="30"/>
                    <circle class="timer-progress" id="timer-progress" cx="36" cy="36" r="30"/>
                  </svg>
                  <span class="timer-value" id="timer-value">15</span>
                </div>
                <div class="timer-caption">Seconds to lock</div>
              </div>

              <div class="power-card glass">
                <h3>${powerName} · one use</h3>
                <p>${powerSentence}</p>
                <button class="power-toggle ${powerArmed ? 'armed' : ''}"
                  data-action="power" ${usedPower || locked ? 'disabled' : ''}>
                  ${usedPower ? 'Power used' : powerArmed ? 'Power armed' : 'Use ' + powerName}
                </button>
              </div>

              <div class="glass" style="padding:14px">
                <div class="field-label">Opponent status</div>
                <div class="small" style="margin-top:6px">
                  <i class="dot ${currentState.opponentLocked ? 'online' : 'offline'}" style="display:inline-block;vertical-align:middle;margin-right:5px"></i>
                  ${currentState.opponentLocked ? 'Pick locked' : 'Choosing a vault'}
                </div>
              </div>
            </aside>
          </div>
        </main>
      `;
    }

    function revealScreen() {
      const reveal = currentState.reveal;
      const thief = playerById(reveal.thiefId);
      const guard = playerById(reveal.guardId);
      let title = 'HEIST SUCCESS';
      let copy = (thief ? escapeHtml(thief.name) : 'The Thief') +
        ' steals ' + reveal.loot + ' loot.';
      let titleClass = '';

      if (reveal.outcome === 'CAUGHT') {
        title = 'CAUGHT';
        titleClass = 'caught';
        copy = 'The Guard called the vault. +2 points to the Guard.';
      } else if (reveal.outcome === 'LOCKDOWN') {
        title = 'LOCKDOWN';
        titleClass = 'lockdown';
        copy = 'The high-value vault is contained. The Thief takes half loot, rounded down.';
      }

      return `
        <main class="screen game-shell reveal-screen ${reveal.outcome === 'CAUGHT' ? 'caught-flash' : ''}">
          <div class="game-top">
            <div class="round-label">${currentState.suddenDeath ? 'Sudden death' : 'Round ' + currentState.round + ' / 6'}</div>
            <div class="role-badge">Simultaneous reveal</div>
            <div class="score-strip">${scorePill(myPlayer())}${scorePill(opponentPlayer())}</div>
          </div>
          <div class="laser">
            <h1 class="reveal-title ${titleClass}">${title}</h1>
            <p class="reveal-copy">${copy}</p>
            ${vaultGrid(reveal)}
          </div>
          <div class="result-card glass">
            <div class="result-deltas">
              <span>${thief ? escapeHtml(thief.name) : 'Thief'} <strong>+${reveal.thiefDelta}</strong></span>
              <span>${guard ? escapeHtml(guard.name) : 'Guard'} <strong>+${reveal.guardDelta}</strong></span>
            </div>
            <p class="muted small" style="margin:10px 0 0">
              ${reveal.ghost ? 'GHOST activated.' : ''}
              ${reveal.lockdown ? 'LOCKDOWN activated.' : ''}
              ${reveal.thiefAuto || reveal.guardAuto ? 'An unconfirmed pick was chosen automatically.' : ''}
            </p>
          </div>
        </main>
      `;
    }

    function historyChips() {
      const recent = currentState.history.slice(-6);
      if (!recent.length) return '';
      return `
        <div class="history-strip" aria-label="Recent round results">
          ${recent.map(item => `
            <div class="history-chip">
              <b>${item.outcome === 'CAUGHT' ? '+2' : '+' + item.thiefDelta}</b>
              <span>${item.suddenDeath ? 'SD' : 'R' + item.round} · ${item.outcome === 'CAUGHT' ? 'Caught' : item.outcome === 'LOCKDOWN' ? 'Lockdown' : 'Heist'}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function scoreboardScreen() {
      const reveal = currentState.reveal;
      const thief = playerById(reveal.thiefId);
      const guard = playerById(reveal.guardId);
      const roundText = currentState.suddenDeath ? 'Sudden death result' : 'Round ' + currentState.round + ' result';

      return `
        <main class="screen center">
          <section class="card">
            <div class="eyebrow">${roundText}</div>
            <h1 class="section-head" style="margin-top:8px">
              ${reveal.outcome === 'CAUGHT' ? 'A clean interception.' :
                reveal.outcome === 'LOCKDOWN' ? 'The vault was contained.' : 'A successful score.'}
            </h1>
            <p class="muted small">
              ${thief ? escapeHtml(thief.name) : 'Thief'} targeted Vault ${reveal.thiefIndex + 1}
              (${reveal.loot} loot). ${guard ? escapeHtml(guard.name) : 'Guard'} protected Vault ${reveal.guardIndex + 1}.
            </p>
            <div class="scoreboard-grid">
              <div class="scoreboard-person glass">
                <strong data-score-id="${myPlayer().id}">${myPlayer().score}</strong>
                <span>${escapeHtml(myPlayer().name)} · You</span>
              </div>
              <div class="scoreboard-person glass">
                <strong data-score-id="${opponentPlayer().id}">${opponentPlayer().score}</strong>
                <span>${escapeHtml(opponentPlayer().name)}</span>
              </div>
            </div>
            ${historyChips()}
            <p class="muted small">Next vault board loading…</p>
          </section>
        </main>
      `;
    }

    function gameoverScreen() {
      const winner = playerById(currentState.winnerId);
      const me = myPlayer();
      const stats = me.stats || { heists: 0, catches: 0, powerUses: 0 };
      const won = winner && winner.id === me.id;

      return `
        <main class="screen center">
          <section class="card">
            <div class="final-mark" aria-hidden="true">${won ? '✦' : '⌁'}</div>
            <div class="eyebrow">${won ? 'The vault is yours' : 'The alarm got you'}</div>
            <h1 class="section-head" style="margin-top:8px">${won ? 'You win.' : 'Heist over.'}</h1>
            <p class="muted small">
              ${winner ? escapeHtml(winner.name) : 'Winner'} takes the match
              ${currentState.suddenDeath ? ' after sudden death' : ''}.
            </p>
            <div class="scoreboard-grid">
              <div class="scoreboard-person glass">
                <strong>${me.score}</strong><span>${escapeHtml(me.name)} · You</span>
              </div>
              <div class="scoreboard-person glass">
                <strong>${opponentPlayer().score}</strong><span>${escapeHtml(opponentPlayer().name)}</span>
              </div>
            </div>
            <div class="final-stats">
              <div class="stat"><strong>${stats.heists}</strong><span>Heists</span></div>
              <div class="stat"><strong>${stats.catches}</strong><span>Catches</span></div>
              <div class="stat"><strong>${stats.powerUses}</strong><span>Powers used</span></div>
            </div>
            <button class="button gold" data-action="rematch">
              ${me.rematch ? 'Rematch requested' : 'Rematch'}
            </button>
            <p class="muted small">
              ${me.rematch ? 'Waiting for the other player to request a rematch.' : 'Both players must choose rematch to play again.'}
            </p>
          </section>
        </main>
      `;
    }

    function opponentLeftScreen() {
      return `
        <main class="screen center">
          <section class="card">
            <div class="eyebrow" style="color:var(--red)">Connection lost</div>
            <h1 class="section-head">Opponent left.</h1>
            <p class="muted small">
              Their 30-second reconnect window expired. This room is closed to new players.
            </p>
            <button class="button primary" data-action="home">Back to start</button>
          </section>
        </main>
      `;
    }

    function tutorialMarkup() {
      const steps = [
        {
          title: 'The Thief picks a target.',
          copy: 'On your Thief rounds, choose one of nine vaults. The loot values are visible to both players.',
          art: '◈'
        },
        {
          title: 'The Guard predicts.',
          copy: 'On your Guard rounds, secretly choose one vault to protect. Match the Thief’s vault to catch them.',
          art: '⌖'
        },
        {
          title: 'Picks reveal together.',
          copy: 'Both picks stay hidden until both players lock in or the 15-second timer runs out.',
          art: '⇄'
        },
        {
          title: 'Spend one power.',
          copy: 'Ghost makes the top-value vault unprotectable this round. Lockdown halves a 4 or 5 loot score, rounded down, even on a match.',
          art: '✦'
        }
      ];
      const step = steps[tutorialStep];

      return `
        <div class="modal-backdrop" role="presentation">
          <section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
            <div class="eyebrow">How to play · ${tutorialStep + 1} of 4</div>
            <div class="tutorial-progress">${steps.map((_, index) => `<i class="${index <= tutorialStep ? 'active' : ''}"></i>`).join('')}</div>
            <div class="tutorial-art" aria-hidden="true">${step.art}</div>
            <h2 id="tutorial-title" class="section-head">${step.title}</h2>
            <p class="muted small">${step.copy}</p>
            <p class="muted small">
              A catch gives the Guard +2. A different vault lets the Thief steal its loot.
              Highest total after six rounds wins; a tie goes to sudden death.
            </p>
            <div class="modal-actions">
              <button class="quiet-button" data-action="tutorial-skip">Skip tutorial</button>
              <button class="button primary" data-action="tutorial-next">
                ${tutorialStep === 3 ? 'Got it' : 'Next'}
              </button>
            </div>
          </section>
        </div>
      `;
    }

    function disconnectedOverlay() {
      if (!currentState || currentState.status !== 'opponentDisconnected') return '';
      const expires = currentState.opponentGraceUntil
        ? Math.max(0, Math.ceil((currentState.opponentGraceUntil - Date.now()) / 1000))
        : 30;

      return `
        <div class="disconnect-shade">
          <section class="disconnect-card glass">
            <div class="radar" aria-hidden="true">⌁</div>
            <div class="eyebrow" style="color:var(--gold)">Signal interrupted</div>
            <h2 class="section-head">Opponent disconnected.</h2>
            <p class="muted small">
              The match is paused while they reconnect. Their reconnect window has ${expires} seconds left.
            </p>
            <div class="waiting-lock"><i class="dot offline"></i> Waiting for opponent</div>
          </section>
        </div>
      `;
    }

    function stateKey(state) {
      if (!state) return '';
      const people = state.players.map(player =>
        [player.id, player.connected, player.ready, player.rematch, player.score].join(':')
      ).join('|');
      const pick = state.myPick ? state.myPick.index + ':' + state.myPick.power : '';
      return [
        state.status, state.pausedStatus, state.round, state.role, people,
        pick, state.opponentLocked, state.winnerId,
        state.history.length, state.reveal && state.reveal.outcome
      ].join(';');
    }

    function render(force = false) {
      if (!currentState) {
        app.innerHTML = topbar() + landingScreen();
        currentViewKey = '';
        return;
      }

      const key = stateKey(currentState);
      if (!force && key === currentViewKey) {
        updateLive();
        return;
      }

      const previousKey = currentViewKey;
      currentViewKey = key;

      const phase = currentState.status === 'opponentDisconnected'
        ? currentState.pausedStatus
        : currentState.status;

      if (phase === 'pick' &&
          (!previousKey || !previousKey.includes(';' + currentState.round + ';'))) {
        selectedIndex = null;
        powerArmed = false;
      }

      let body;
      if (currentState.status === 'opponentLeft') body = opponentLeftScreen();
      else if (phase === 'lobby') body = lobbyScreen();
      else if (phase === 'ready') body = readyScreen();
      else if (phase === 'pick') body = gameScreen();
      else if (phase === 'reveal') body = revealScreen();
      else if (phase === 'scoreboard') body = scoreboardScreen();
      else if (phase === 'gameover') body = gameoverScreen();
      else body = lobbyScreen();

      app.innerHTML = topbar() + body + disconnectedOverlay() +
        (tutorialOpen ? tutorialMarkup() : '');

      if (phase === 'reveal' && currentState.status === 'reveal') {
        const previousRevealKey = window.lastRevealKey;
        const revealKey = currentState.round + ':' +
          currentState.reveal.outcome + ':' + currentState.reveal.thiefIndex;
        if (previousRevealKey !== revealKey) {
          window.lastRevealKey = revealKey;
          playSound('scan');
          if (currentState.reveal.outcome === 'CAUGHT') {
            playSound('alarm');
            if (!reducedMotion) app.querySelector('.reveal-screen')?.classList.add('shake');
          } else {
            playSound('coin');
            if (!reducedMotion) burstCoins(currentState.reveal.thiefIndex);
          }
        }
      }

      if (phase === 'scoreboard') {
        animateScoreCounters();
        if (currentState.reveal && currentState.reveal.outcome === 'CAUGHT') playSound('lose');
      }

      if (phase === 'gameover') {
        playSound(currentState.winnerId === currentState.playerId ? 'win' : 'lose');
        if (currentState.winnerId === currentState.playerId && !reducedMotion) burstConfetti();
      }

      updateLive();
    }

    function updateLive() {
      if (!currentState) return;

      const timerValue = document.getElementById('timer-value');
      const progress = document.getElementById('timer-progress');
      const timerCard = document.getElementById('timer-card');

      if (timerValue && currentState.deadlineAt) {
        const remaining = Math.max(
          0,
          currentState.deadlineAt - (Date.now() + serverClockOffset)
        );
        const seconds = Math.ceil(remaining / 1000);
        const fraction = Math.max(0, Math.min(1, remaining / 15_000));

        timerValue.textContent = String(seconds);
        if (progress) progress.style.strokeDashoffset = String(188.5 * (1 - fraction));
        if (timerCard) timerCard.classList.toggle('urgent', seconds <= 5);

        if (seconds <= 4 && seconds > 0 && seconds !== lastTickSecond) {
          lastTickSecond = seconds;
          playSound('tick');
        }
      }

      const disconnectText = document.querySelector('.disconnect-card .small');
      if (disconnectText && currentState.opponentGraceUntil) {
        const expires = Math.max(
          0,
          Math.ceil((currentState.opponentGraceUntil - Date.now()) / 1000)
        );
        disconnectText.textContent =
          'The match is paused while they reconnect. Their reconnect window has ' +
          expires + ' seconds left.';
      }
    }

    function showToast(message, isError = false) {
      toastElement.textContent = message;
      toastElement.classList.toggle('toast-error', isError);
      toastElement.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastElement.classList.remove('show'), 2800);
    }

    function shareUrl() {
      return location.origin + location.pathname + '?room=' + currentState.room;
    }

    async function copyInvite() {
      try {
        await navigator.clipboard.writeText(shareUrl());
        showToast('Invite link copied.');
      } catch {
        const field = document.createElement('textarea');
        field.value = shareUrl();
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        field.remove();
        showToast('Invite link copied.');
      }
    }

    function finishTutorial() {
      tutorialOpen = false;
      localStorage.setItem(TUTORIAL_KEY, 'done');
      render(true);
    }

    function startAudio() {
      if (muted || audioContext) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      try {
        audioContext = new AudioContextClass();
      } catch {
        audioContext = null;
      }
    }

    function tone(frequency, duration, type = 'sine', volume = .08, endFrequency = null) {
      if (!audioContext || muted) return;

      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      if (endFrequency) {
        oscillator.frequency.exponentialRampToValueAtTime(
          Math.max(20, endFrequency),
          now + duration
        );
      }

      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + .015);
      gain.gain.exponentialRampToValueAtTime(.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + .02);
    }

    function playSound(name) {
      if (muted) return;
      startAudio();
      if (!audioContext) return;

      if (audioContext.state === 'suspended') audioContext.resume();

      if (name === 'click') tone(540, .07, 'triangle', .035, 420);
      if (name === 'lock') {
        tone(240, .18, 'triangle', .08, 110);
        setTimeout(() => tone(740, .12, 'sine', .045, 980), 65);
      }
      if (name === 'scan') tone(240, .75, 'sawtooth', .035, 1350);
      if (name === 'alarm') {
        tone(880, .14, 'square', .06, 620);
        setTimeout(() => tone(620, .16, 'square', .055, 880), 160);
        setTimeout(() => tone(880, .14, 'square', .05, 620), 340);
      }
      if (name === 'coin') {
        tone(880, .12, 'sine', .07, 1320);
        setTimeout(() => tone(1180, .16, 'sine', .055, 1680), 90);
      }
      if (name === 'tick') tone(720, .045, 'square', .035, 660);
      if (name === 'win') {
        tone(523, .25, 'triangle', .07, 660);
        setTimeout(() => tone(659, .25, 'triangle', .07, 784), 160);
        setTimeout(() => tone(784, .42, 'triangle', .08, 1046), 320);
      }
      if (name === 'lose') {
        tone(360, .35, 'triangle', .06, 220);
        setTimeout(() => tone(240, .45, 'sine', .05, 90), 240);
      }
    }

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function addBurst(x, y, color, count) {
      if (reducedMotion) return;
      for (let index = 0; index < count && particles.length < 150; index += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.1 + Math.random() * 4.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          life: 1,
          size: 2 + Math.random() * 4,
          color,
          gravity: .045 + Math.random() * .07
        });
      }
      runParticleFrame();
    }

    function burstCoins(index) {
      const target = document.querySelector('.reveal-grid .vault[data-index="' + index + '"]');
      if (!target) return;
      const rect = target.getBoundingClientRect();
      addBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#FFC94A', 40);
      addBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#00E5FF', 18);
    }

    function burstConfetti() {
      addBurst(window.innerWidth / 2, window.innerHeight * .35, '#00E5FF', 55);
      addBurst(window.innerWidth / 2, window.innerHeight * .35, '#FFC94A', 40);
      addBurst(window.innerWidth / 2, window.innerHeight * .35, '#FF2E93', 30);
    }

    function runParticleFrame() {
      if (particleFrame || document.hidden || reducedMotion) return;

      const draw = () => {
        particleFrame = null;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        particles = particles.filter(particle => particle.life > 0);
        for (const particle of particles) {
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.vy += particle.gravity;
          particle.life -= .015;

          ctx.globalAlpha = Math.max(0, particle.life);
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size * particle.life, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        if (particles.length) particleFrame = requestAnimationFrame(draw);
      };

      particleFrame = requestAnimationFrame(draw);
    }

    function animateScoreCounters() {
      const counters = document.querySelectorAll('[data-score-id]');
      for (const counter of counters) {
        const id = counter.getAttribute('data-score-id');
        const target = Number(counter.textContent) || 0;
        const start = priorScores && Number.isFinite(priorScores[id])
          ? priorScores[id]
          : target;
        const startTime = performance.now();
        const duration = 650;

        const frame = now => {
          const t = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          counter.textContent = String(Math.round(start + (target - start) * eased));
          if (t < 1) requestAnimationFrame(frame);
        };

        counter.textContent = String(start);
        requestAnimationFrame(frame);
      }
    }

    function vibrate() {
      if ('vibrate' in navigator) navigator.vibrate(12);
    }

    document.addEventListener('pointerdown', startAudio, { once: true });

    document.addEventListener('click', event => {
      const actionButton = event.target.closest('[data-action]');
      const vaultButton = event.target.closest('.vault[data-index]');

      if (actionButton) playSound('click');

      if (vaultButton && !vaultButton.hasAttribute('tabindex')) {
        const me = myPlayer();
        if (currentState && currentState.status === 'pick' &&
            (!currentState.myPick) && me && !connectionLost) {
          selectedIndex = Number(vaultButton.dataset.index);
          document.querySelectorAll('.vault[data-index]').forEach(button => {
            const selected = Number(button.dataset.index) === selectedIndex;
            button.classList.toggle('selected', selected);
            button.setAttribute('aria-pressed', String(selected));
          });
          const confirmButton = document.querySelector('[data-action="confirm"]');
          if (confirmButton) confirmButton.disabled = false;
          vibrate();
        }
        return;
      }

      if (!actionButton) return;
      const action = actionButton.dataset.action;

      if (action === 'create') {
        sendIntent({ type: 'create', name: getName() });
      }

      if (action === 'join-toggle') {
        getName();
        joinFormOpen = !joinFormOpen;
        render(true);
        if (joinFormOpen) document.getElementById('room-code-input')?.focus();
      }

      if (action === 'join') {
        const room = (document.getElementById('room-code-input')?.value || '')
          .trim().toUpperCase();
        if (!/^[A-Z]{4}$/.test(room)) {
          showToast('Enter exactly four letters for the room code.', true);
          return;
        }
        sendIntent({ type: 'join', room, name: getName() });
      }

      if (action === 'copy') copyInvite();
      if (action === 'ready') {
        if (sendIntent({ type: 'ready' })) vibrate();
      }

      if (action === 'power') {
        if (myPlayer() && myPlayer().powerUsed) return;
        powerArmed = !powerArmed;
        render(true);
        vibrate();
      }

      if (action === 'confirm') {
        if (selectedIndex === null) {
          showToast('Choose a vault first.', true);
          return;
        }
        if (sendIntent({
          type: 'pick',
          index: selectedIndex,
          power: powerArmed
        })) {
          vibrate();
        }
      }

      if (action === 'tutorial-open') {
        getName();
        tutorialOpen = true;
        tutorialStep = 0;
        render(true);
      }

      if (action === 'tutorial-skip') finishTutorial();

      if (action === 'tutorial-next') {
        if (tutorialStep >= 3) finishTutorial();
        else {
          tutorialStep += 1;
          render(true);
        }
      }

      if (action === 'mute') {
        muted = !muted;
        localStorage.setItem(MUTE_KEY, String(muted));
        if (!muted) startAudio();
        render(true);
      }

      if (action === 'rematch') {
        if (sendIntent({ type: 'rematch' })) vibrate();
      }

      if (action === 'home') {
        localStorage.removeItem(STORAGE_KEY);
        location.href = location.pathname;
      }
    });

    document.addEventListener('keydown', event => {
      const target = event.target;
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) {
        if (event.key === 'Enter' && target.id === 'room-code-input') {
          event.preventDefault();
          document.querySelector('[data-action="join"]')?.click();
        }
        return;
      }

      if (tutorialOpen && event.key === 'Escape') {
        finishTutorial();
        return;
      }

      if (!currentState || currentState.status !== 'pick' || currentState.myPick) return;
      if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) return;

      event.preventDefault();
      const current = selectedIndex === null ? 0 : selectedIndex;
      let next = current;

      if (event.key === 'ArrowLeft') next = current % 3 === 0 ? current : current - 1;
      if (event.key === 'ArrowRight') next = current % 3 === 2 ? current : current + 1;
      if (event.key === 'ArrowUp') next = Math.max(0, current - 3);
      if (event.key === 'ArrowDown') next = Math.min(8, current + 3);

      selectedIndex = next;
      document.querySelectorAll('.vault[data-index]').forEach(button => {
        const selected = Number(button.dataset.index) === selectedIndex;
        button.classList.toggle('selected', selected);
        button.setAttribute('aria-pressed', String(selected));
      });

      const confirmButton = document.querySelector('[data-action="confirm"]');
      if (confirmButton) confirmButton.disabled = false;
      document.querySelector('.vault[data-index="' + next + '"]')?.focus();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && particleFrame) {
        cancelAnimationFrame(particleFrame);
        particleFrame = null;
      } else if (!document.hidden && particles.length) {
        runParticleFrame();
      }
    });

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resizeCanvas, 120);
    });

    resizeCanvas();
    countdownTimer = setInterval(updateLive, 250);
    connect();
    render();
  </script>
</body>
</html>
